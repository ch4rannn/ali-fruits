<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>You are offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fffdf7; color: #1c261f; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 1.5rem; }
      main { max-width: 22rem; }
      h1 { font-size: 1.75rem; color: #1e4d2b; margin: 0 0 0.5rem; }
      p { color: #4a5a4f; line-height: 1.5; }
      a { display: inline-block; margin-top: 1rem; background: #1e4d2b; color: #fffdf7; padding: 0.75rem 1.5rem; border-radius: 6px; text-decoration: none; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>We could not reach the shop. Check your internet connection and try again. Your cart is saved on this phone.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
